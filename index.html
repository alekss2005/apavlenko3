/* ============================================================
   WebSocket + REST
============================================================ */
let ws=null,wsConnected=false,wsReconnectMs=CONFIG.WS_RECONNECT_MS,wsReconnectTimer=null;
let restFallbackActive=false,pollTimer=null,abortCtrl=null;
const wsState={threats:new Map(),alerts:null};
function wsScheduleReconnect(){
  if(wsReconnectTimer)return;
  wsReconnectTimer=setTimeout(()=>{wsReconnectTimer=null;wsConnect();},wsReconnectMs);
  wsReconnectMs=Math.min(wsReconnectMs*2,CONFIG.WS_RECONNECT_MAX_MS);
}
function wsConnect(){
  try{
    if(ws){try{ws.close();}catch(e){}ws=null;}
    ws=new WebSocket(CONFIG.WS_URL);
    ws.onopen=()=>{wsConnected=true;wsReconnectMs=CONFIG.WS_RECONNECT_MS;restFallbackActive=false;stopRestPolling();updateLiveBadge("ok");};
    ws.onmessage=(e)=>{try{wsHandleFrame(JSON.parse(e.data));}catch(err){}};
    ws.onerror=()=>{};
    ws.onclose=()=>{
      wsConnected=false;ws=null;updateLiveBadge("err");
      if(!restFallbackActive){restFallbackActive=true;startRestPolling();}
      wsScheduleReconnect();
    };
  }catch(e){if(!restFallbackActive){restFallbackActive=true;startRestPolling();}wsScheduleReconnect();}
}
function wsHandleFrame(env){
  if(!env||!env.type)return;
  switch(env.type){
    case "snapshot":{
      const data=env.data||{};
      wsState.threats.clear();
      for(const t of (data.threats||[]))if(t.id)wsState.threats.set(t.id,t);
      if(data.alerts){wsState.alerts=data.alerts;try{syncAlertPolygons(data.alerts);}catch(e){}}
      applyThreatsFromWs();break;
    }
    case "upsert":{const t=env.data;if(t&&t.id){wsState.threats.set(t.id,t);applyThreatsFromWs();}break;}
    case "remove":{const data=env.data||{};if(data.id)wsState.threats.delete(data.id);applyThreatsFromWs();break;}
    case "alerts":{const data=env.data||{};wsState.alerts=data;try{syncAlertPolygons(data);}catch(e){}break;}
  }
}
function applyThreatsFromWs(){try{syncThreats([...wsState.threats.values()]);}catch(e){}}
async function fetchMessages(){
  try{
    const r=await fetch(CONFIG.API_MESSAGES);
    if(!r.ok)throw new Error("messages "+r.status);
    const data=await r.json();
    try{syncMessageThreats(data.messages||[]);}catch(e){}
  }catch(e){}
}
async function fetchThreatsAndAlerts(){
  try{
    if(abortCtrl)abortCtrl.abort();
    abortCtrl=new AbortController();
    const signal=abortCtrl.signal;
    const[tr,al]=await Promise.all([
      fetch(CONFIG.API_THREATS,{signal}).then(r=>{if(!r.ok)throw new Error("threats "+r.status);return r.json();}),
      fetch(CONFIG.API_ALERTS,{signal}).then(r=>{if(!r.ok)throw new Error("alerts "+r.status);return r.json();})
    ]);
    try{syncThreats(tr.threats||[]);}catch(e){}
    try{syncAlertPolygons(al);}catch(e){}
    updateLiveBadge("ok");
  }catch(e){if(e.name!=="AbortError")updateLiveBadge("err");}
}
async function restPollLoop(){await fetchThreatsAndAlerts();await fetchMessages();pollTimer=setTimeout(restPollLoop,CONFIG.POLL_MS);}
function startRestPolling(){if(pollTimer)clearTimeout(pollTimer);restPollLoop();}
function stopRestPolling(){if(pollTimer){clearTimeout(pollTimer);pollTimer=null;}if(abortCtrl){abortCtrl.abort();abortCtrl=null;}}
function updateLiveBadge(state){
  const badge=$("liveBadge");if(!badge)return;
  if(state==="ok"){badge.textContent=wsConnected?"онлайн · WS":"онлайн";badge.className="live-badge live"+(wsConnected?" ws":"");}
  else if(state==="err"){badge.textContent="ошибка";badge.className="live-badge stale";}
}
let lastAlerts=null;
async function loadAlertGeo(signal){
  try{
    await Promise.all([
      fetch("https://neptun.in.ua/raions.geojson",{signal}).then(x=>x.json()),
      fetch("https://neptun.in.ua/oblasts.geojson",{signal}).then(x=>x.json())
    ]);
    if(lastAlerts)syncAlertPolygons(lastAlerts);
  }catch(e){if(e.name!=="AbortError")console.warn(e);}
}
let alertLayers=[];
function syncAlertPolygons(alerts){
  if(!alerts)return;
  lastAlerts=alerts;
  for(const layer of alertLayers){
    try{alertLayer.removeLayer(layer);}catch(e){}
  }
  alertLayers=[];
  const allLists=[];
  if(alerts.raions)allLists.push(...alerts.raions);
  if(alerts.oblasts)allLists.push(...alerts.oblasts);
  if(alerts.regions)allLists.push(...alerts.regions);
  for(const a of allLists){
    if(!a.geometry&&!a.coords&&!a.polygon)continue;
    let latlngs=null;
    try{
      if(a.geometry&&a.geometry.type==="Polygon"){
        latlngs=a.geometry.coordinates.map(ring=>ring.map(c=>[c[1],c[0]]));
      } else if(a.geometry&&a.geometry.type==="MultiPolygon"){
        latlngs=a.geometry.coordinates.map(poly=>poly.map(ring=>ring.map(c=>[c[1],c[0]])));
      } else if(a.coords){
        latlngs=a.coords.map(c=>[c[1],c[0]]);
      } else if(a.polygon){
        latlngs=a.polygon.map(c=>[c[1],c[0]]);
      }
    }catch(e){continue;}
    if(!latlngs)continue;
    const alertName=String(a.name||"")+" "+String(a.key||"");
    const isKyiv=isKyivOrOblast(alertName);
    let color="#dc2626";
    let fillColor="#dc2626";
    if(/обл/i.test(alertName)||/область/.test(alertName)){
      color="#ea580c";fillColor="#ea580c";
    }
    if(isKyiv){
      color="#dc2626";fillColor="#dc2626";
    }
    try{
      const layer=L.polygon(latlngs,{
        color:color,
        weight:1.5,
        opacity:.8,
        fillColor:fillColor,
        fillOpacity:.15,
        interactive:isKyiv,
        className:"alert-polygon"
      });
      if(isKyiv){
        layer.bindPopup(`<div class="popup-title" style="color:#f87171">🚨 Воздушная тревога</div>
          <div class="popup-meta"><b>${esc(a.name||a.key||"")}</b><br>Регион: Киев/Киевская область</div>`);
      }
      layer.addTo(alertLayer);
      alertLayers.push(layer);
    }catch(e){}
  }
}

function clearAll(){
  msgMarkers.forEach(o=>{if(o.marker&&msgThreatLayer)try{msgThreatLayer.removeLayer(o.marker);}catch(e){}});
  msgMarkers.clear();
  impactMarkers.forEach(o=>{if(o.marker&&impactLayer)try{impactLayer.removeLayer(o.marker);}catch(e){}});
  impactMarkers.clear();
  tracks.forEach(tr=>{
    if(tr.marker&&threatLayer)try{threatLayer.removeLayer(tr.marker);}catch(e){}
    if(tr.trailLine&&map)try{map.removeLayer(tr.trailLine);}catch(e){}
  });
  tracks.clear();
  for(const key of[...trails.keys()])closeTrail(key);
  trails.clear();
  for(const[id,w]of[...activeWarnings])if(w.marker&&msgThreatLayer)try{msgThreatLayer.removeLayer(w.marker);}catch(e){}
  activeWarnings.clear();
  for(const[key,r]of[...impactReports])if(r.marker&&impactLayer)try{impactLayer.removeLayer(r.marker);}catch(e){}
  impactReports.clear();
  renderWarningsPanel();
}
function refreshAllIcons(){
  for(const tr of tracks.values()){
    try{
      const t=tr.threat;
      tr.marker.setIcon(makeIcon(t,tr.heading,false,0,0,tr.eta,tr.stale,tr.advisory,tr.areaOnly,tr.uncertain,null,null,tr.inSirenZone));
    }catch(e){}
  }
}
$("btnRefresh").addEventListener("click",()=>{
  unlockAudio();
  if(wsConnected&&ws){try{ws.close();}catch(e){}wsConnect();}
  else startRestPolling();
  showToast("Обновление…");
});
$("btnClear").addEventListener("click",()=>{unlockAudio();clearAll();showToast("Очищено");});
$("btnAIExplain").addEventListener("click",()=>{unlockAudio();showAIExplain();});

(function initSoundToggle(){
  const btn=$("soundToggle");if(!btn)return;
  function updateBtn(){btn.textContent=CONFIG.SOUND_ENABLED?"🔔":"🔕";btn.className="sound-btn "+(CONFIG.SOUND_ENABLED?"on":"muted");}
  updateBtn();
  let lastTap=0;
  btn.addEventListener("click",(e)=>{
    e.preventDefault();e.stopPropagation();
    unlockAudio();
    const now=Date.now();
    playAlertSound(true);
    if(now-lastTap<500){CONFIG.SOUND_ENABLED=!CONFIG.SOUND_ENABLED;updateBtn();showToast(CONFIG.SOUND_ENABLED?"🔔 вкл":"🔕 выкл");lastTap=0;}
    else{lastTap=now;showToast("🔔 Тест");}
  });
})();
/* v14.20.0: кнопка сирены */
(function initSirenBtn(){
  const btn=$("sirenBtn");if(!btn)return;
  let lastTap=0;
  btn.addEventListener("click",(e)=>{
    e.preventDefault();e.stopPropagation();
    unlockAudio();
    const now=Date.now();
    if(now-lastTap<500){
      /* двойной тап — 3 сигнала (полная баллистическая тревога) */
      triggerSirenSequence(3000,3);
      showToast("🚨 3× сирена (тест)");
      lastTap=0;
    }else{
      /* одиночный тап — 1 сигнал 3 сек */
      playSirenOnce(3000);
      flashSirenBtn(3000);
      showToast("🚨 1× сирена 3 сек (двойной тап = 3×)");
      lastTap=now;
    }
  });
})();
(function initColorToggle(){
  const btn=$("btnColorToggle");if(!btn)return;
  function updateBtn(){
    const c=UAV_COLORS[uavColorIdx];
    btn.textContent="🎨";
    btn.style.background=c.hex;
    btn.style.borderColor=(c.id==="white")?"rgba(148,163,184,.5)":"rgba(0,0,0,.35)";
    btn.style.color=(c.id==="white"||c.id==="yellow")?"#1e293b":"#fff";
    btn.title="Цвет БПЛА: "+c.name;
  }
  updateBtn();
  btn.addEventListener("click",(e)=>{
    e.preventDefault();e.stopPropagation();
    uavColorIdx=(uavColorIdx+1)%UAV_COLORS.length;
    saveUavColor();updateBtn();refreshAllIcons();
    showToast("🎨 БПЛА: "+UAV_COLORS[uavColorIdx].name);
    unlockAudio();
  });
})();
(function initRingsToggle(){
  const btn=$("btnRingsToggle");if(!btn||!map)return;
  try{
    const v=localStorage.getItem(RINGS_KEY);
    if(v==="0")ringsVisible=false;else if(v==="1")ringsVisible=true;
  }catch(e){}
  function apply(){
    if(ringsVisible){
      if(!map.hasLayer(ringsLayer))ringsLayer.addTo(map);
      btn.classList.add("on");btn.classList.remove("off");
    }else{
      if(map.hasLayer(ringsLayer))map.removeLayer(ringsLayer);
      btn.classList.add("off");btn.classList.remove("on");
    }
  }
  apply();
  btn.addEventListener("click",(e)=>{
    e.preventDefault();e.stopPropagation();
    ringsVisible=!ringsVisible;
    try{localStorage.setItem(RINGS_KEY,ringsVisible?"1":"0");}catch(e2){}
    apply();showToast(ringsVisible?"🎯 Круги ВКЛ":"🎯 Круги ВЫКЛ");
    unlockAudio();
  });
})();
(function initBasemapToggle(){
  const btn=$("btnMapToggle");if(!btn||!map)return;
  btn.addEventListener("click",(e)=>{
    e.preventDefault();e.stopPropagation();
    unlockAudio();
    if(currentBase==="osm"){
      if(osmLayer)map.removeLayer(osmLayer);
      baseSat.addTo(map);
      currentBase="sat";
      btn.classList.add("on");
      showToast("🛰 Спутник");
    }else{
      map.removeLayer(baseSat);
      osmLayer=L.tileLayer(CONFIG.TILE_URL,{maxZoom:19,attribution:CONFIG.TILE_ATTR});
      osmLayer.addTo(map);
      currentBase="osm";
      btn.classList.remove("on");
      showToast("🗺 Схема");
    }
  });
})();
(function initWarningsPanelToggle(){
  const panel=$("warningsPanel"),header=$("warningsHeader");
  if(!panel||!header)return;
  header.addEventListener("click",()=>{panel.classList.toggle("collapsed");});
})();
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){stopRestPolling();stopAnim();}
  else{if(!wsConnected)startRestPolling();startAnim();unlockAudio();}
});

(async function init(){
  try{
    loadUavColor();
    const ctrl=new AbortController();
    loadAlertGeo(ctrl.signal);
    wsConnect();
    fetchMessages();
    setInterval(fetchMessages,5000);
    startAnim();
    renderWarningsPanel();
    setTimeout(()=>unlockAudio(),500);
  }catch(e){
    showErr("init: "+(e&&e.message||e));
  }
})();
</script>
</body>
